targets:
  $default:
    builders:
      json_serializable:
        options:
          # Gemma 4 emits snake_case JSON; Dart uses camelCase. This rename
          # bridges the two so we don't have to put @JsonKey on every field.
          field_rename: snake
          explicit_to_json: true
          create_to_json: true
          create_factory: true
